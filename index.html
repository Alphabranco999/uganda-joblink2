<!DOCTYPE html>
<html lang="en">
<head>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1643408490792413"
 crossorigin="anonymous"></script>

<meta charset="UTF-8">
<title>Uganda JobsLink</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0a66c2">

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #001A33;
    font-family: Arial, sans-serif;
    color: white;
    text-align: center;
    overflow: hidden;
}

/* FADE OUT */
.fade-out {
    animation: fadeOutScreen 0.8s ease forwards;
}
@keyframes fadeOutScreen {
    to { opacity: 0; transform: scale(0.95); }
}

.wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
}

/* IMAGE */
.image-box {
    width: 90%;
    max-width: 400px;
    height: 260px;
    background: #fff;
    border-radius: 20px;
    overflow: hidden;
    opacity: 0;
    animation: imageEnter 1.2s ease-out forwards;
    box-shadow: 0 0 30px rgba(255,255,255,0.3);
}
@keyframes imageEnter {
    0% { opacity: 0; transform: translateY(-80px) scale(0.7); }
    70% { opacity: 1; transform: translateY(-20px) scale(1.05); }
    100% { opacity: 1; transform: translateY(-30px) scale(1); }
}
.image-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* TEXT FIT */
#fit-box {
    display: inline-block;
    transform-origin: center;
    white-space: nowrap;
}

/* LETTER ANIMATION */
.welcome span {
    display: inline-block;
    opacity: 0;
    transform: translateY(-60px);
    animation: dropStay 0.7s cubic-bezier(0.25, 1.5, 0.5, 1) forwards;
}
@keyframes dropStay {
    0% { opacity: 0; transform: translateY(-60px); }
    70% { opacity: 1; transform: translateY(8px); }
    85% { transform: translateY(-3px); }
    100% { opacity: 1; transform: translateY(0); }
}

.welcome {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 1px;
}

/* LOADING TEXT */
.loading-text {
    font-size: 14px;
    margin-top: 20px;
    opacity: 0;
    animation: fadeInText 1s ease-out forwards;
    animation-delay: 1.5s;
}
@keyframes fadeInText {
    from { opacity: 0; }
    to { opacity: 1; }
}

.dots::after {
    content: '';
    animation: dots 1.5s infinite;
}
@keyframes dots {
    0% { content: ''; }
    33% { content: '.'; }
    66% { content: '..'; }
    100% { content: '...'; }
}

/* PERCENT */
.percent {
    font-size: 15px;
    margin-top: 6px;
    opacity: 0;
    animation: fadeInPercent 1s ease-out forwards;
    animation-delay: 1.7s;
}
@keyframes fadeInPercent {
    from { opacity: 0; }
    to { opacity: 1; }
}

/* PROGRESS BAR */
.progress-container {
    width: 80%;
    height: 10px;
    background: rgba(255,255,255,0.15);
    border-radius: 20px;
    margin-top: 12px;
    overflow: hidden;
    opacity: 0;
    animation: fadeInBar 1s ease-out forwards;
    animation-delay: 1.9s;
}
@keyframes fadeInBar {
    from { opacity: 0; }
    to { opacity: 1; }
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #00FFA3, #00D4FF, #0084FF);
    border-radius: 20px;
    transition: width 0.2s linear;
}
</style>
</head>

<body>

<div class="wrapper">

    <div class="image-box">
        <img src="image_666.png" alt="Uganda JobsLink">
    </div>

    <div id="fit-box">
        <h2 class="welcome" id="welcomeText"></h2>
    </div>

    <div class="loading-text"><span class="dots">Loading</span></div>
    <div class="percent" id="percent">0%</div>

    <div class="progress-container">
        <div class="progress-bar"></div>
    </div>

</div>

<script>

/* TEXT CONTENT */
const text = "Connecting Workers and Employers";
const container = document.getElementById("welcomeText");

/* CREATE LETTERS DYNAMICALLY (better than hardcoding spans) */
text.split("").forEach((char, i) => {
    const span = document.createElement("span");
    span.innerHTML = char === " " ? "&nbsp;" : char;
    span.style.animationDelay = (i * 0.03) + "s";
    container.appendChild(span);
});

/* FIT TEXT (ANDROID SAFE) */
function fitText() {
    const box = document.getElementById("fit-box");
    let scale = 1;

    function adjust() {
        if (box.scrollWidth > window.innerWidth - 20 && scale > 0.5) {
            scale -= 0.02;
            box.style.transform = `scale(${scale})`;
            requestAnimationFrame(adjust);
        }
    }
    adjust();
}

/* LOAD */
window.onload = () => {

    // Wait for animation to settle before fitting
    setTimeout(() => {
        fitText();
    }, 800);

    window.addEventListener("resize", fitText);

    // PROGRESS SYSTEM (SYNCED)
    setTimeout(() => {
        let percent = 0;
        const bar = document.querySelector(".progress-bar");

        let counter = setInterval(() => {
            percent++;
            document.getElementById("percent").innerText = percent + "%";
            bar.style.width = percent + "%";

            if (percent >= 100) {
                clearInterval(counter);
                document.body.classList.add("fade-out");

                setTimeout(() => {
                    window.location.href = "index2.html";
                }, 800);
            }
        }, 30);

    }, 1500);
};

/* SERVICE WORKER */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("/service-worker.js")
      .then(reg => console.log("Service Worker registered:", reg.scope))
      .catch(err => console.log("Service Worker failed:", err));
  });
}

</script>

</body>
</html>
