<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uganda JobsLink</title>

<style>

/* ===== BASE ===== */
body {
    margin: 0;
    height: 100vh;
    background: #001A33;
    font-family: Arial, sans-serif;
    overflow: hidden;
    color: white;
}

/* ===== BACKGROUND ===== */
.bg {
    position: fixed;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at center, #0a66c2 0%, transparent 60%),
                radial-gradient(circle at 30% 70%, #00d4ff33, transparent 60%),
                #000814;
    z-index: -1;
}

/* ===== CENTER WRAPPER ===== */
.wrapper {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 15px;
}

/* ===== LOGO BOX (WHITE CARD) ===== */
.image-box {
    width: 80%;
    max-width: 320px;

    height: 180px;   /* ⬅️ smaller, mobile-friendly */

    background: #ffffff;
    border: 2px solid #ffffff;
    border-radius: 22px;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 10px;

    overflow: hidden;

    box-shadow: 0 20px 50px rgba(0,0,0,0.3);

    animation: imageEnter 1.2s ease-out forwards;
}
   .image-box img {
    width: 100%;
    height: 100%;
    object-fit: contain;
} 

/* LOGO IMAGE */
.image-box {
    width: 88%;
    max-width: 380px;

    height: 240px;   /* ⬅️ balanced size for mobile */

    background: #ffffff;
    border: 2px solid #ffffff;
    border-radius: 24px;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 14px;

    overflow: hidden;

    box-shadow: 0 25px 60px rgba(0,0,0,0.35);

    animation: imageEnter 1.2s ease-out forwards;
}

/* LOGO ANIMATION */
@keyframes imageEnter {
    0% {
        opacity: 0;
        transform: translateY(-60px) scale(0.7);
    }
    100% {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* ===== TEXT ===== */
.welcome {
    font-size: clamp(18px, 5vw, 26px);
    font-weight: bold;
    margin-top: 20px;
    text-align: center;
}

/* ===== LOADING ===== */
.loading-text {
    margin-top: 20px;
    font-size: 14px;
    opacity: 0.8;
}

.percent {
    margin-top: 5px;
}

/* ===== PROGRESS BAR ===== */
.progress-container {
    width: 80%;
    height: 8px;
    background: rgba(255,255,255,0.2);
    border-radius: 20px;
    margin-top: 10px;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #00FFA3, #00D4FF, #0084FF);
    border-radius: 20px;
}

</style>
</head>

<body>

<!-- BACKGROUND -->
<div class="bg"></div>

<!-- UI -->
<div class="wrapper">

    <div class="image-box">
        <img src="image_666.png" alt="logo">
    </div>

    <div class="welcome">Connecting Workers and Employers</div>

    <div class="loading-text">Loading...</div>
    <div class="percent" id="percent">0%</div>

    <div class="progress-container">
        <div class="progress-bar"></div>
    </div>

</div>

<script>

/* ===== LOADING SYSTEM ===== */
let percent = 0;

const bar = document.querySelector(".progress-bar");
const text = document.getElementById("percent");

let interval = setInterval(() => {

    percent++;

    text.innerText = percent + "%";
    bar.style.width = percent + "%";

    if (percent >= 100) {
        clearInterval(interval);

        setTimeout(() => {
            window.location.href = "index2.html";
        }, 500);
    }

}, 30);

</script>

</body>
</html>
