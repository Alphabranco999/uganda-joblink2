<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uganda JobsLink</title>

<style>

body {
    margin: 0;
    height: 100vh;
    background: #001A33;
    font-family: Arial, sans-serif;
    overflow: hidden;
    color: white;
}

/* ===== BACKGROUND ===== */
.premium-bg {
    position: fixed;
    width: 100%;
    height: 100%;
    z-index: -1;
    overflow: hidden;
}

/* SOFT PARTICLES */
.particle {
    position: absolute;
    width: 6px;
    height: 6px;
    background: rgba(255,255,255,0.25);
    border-radius: 50%;
    animation: fall linear infinite;
    filter: blur(1px);
}

@keyframes fall {
    from {
        transform: translateY(-10vh);
        opacity: 0;
    }
    20% { opacity: 0.4; }
    to {
        transform: translateY(110vh);
        opacity: 0;
    }
}

/* ===== UI ===== */
.wrapper {
    position: relative;
    z-index: 10;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

/* LOGO */
.image-box {
    width: 90%;
    max-width: 380px;
    height: 240px;
    background: white;
    border-radius: 20px;
    overflow: hidden;
}

.image-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* TEXT */
.welcome {
    font-size: 22px;
    font-weight: bold;
    margin-top: 20px;
    text-align: center;
    max-width: 90%;
}

/* LOADING */
.loading {
    margin-top: 15px;
    font-size: 14px;
    opacity: 0.8;
}

.percent {
    margin-top: 5px;
}

/* BAR */
.progress-container {
    width: 80%;
    height: 10px;
    background: rgba(255,255,255,0.2);
    border-radius: 20px;
    margin-top: 10px;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg,#00FFA3,#00D4FF,#0084FF);
    border-radius: 20px;
    transition: width 0.1s linear;
}

</style>
</head>

<body>

<!-- BACKGROUND -->
<div class="premium-bg"></div>

<!-- UI -->
<div class="wrapper">

    <div class="image-box">
        <img src="image_666.png">
    </div>

    <div class="welcome" id="text"></div>

    <div class="loading">Loading...</div>
    <div class="percent" id="percent">0%</div>

    <div class="progress-container">
        <div class="progress-bar"></div>
    </div>

</div>

<script>

/* ===== SOFT PARTICLES ===== */
const bg = document.querySelector(".premium-bg");

function createParticle() {
    const p = document.createElement("div");
    p.className = "particle";

    p.style.left = Math.random() * 100 + "vw";
    p.style.animationDuration = (4 + Math.random() * 6) + "s";
    p.style.width = p.style.height = (3 + Math.random() * 4) + "px";
    p.style.opacity = Math.random() * 0.5;

    bg.appendChild(p);

    setTimeout(() => p.remove(), 10000);
}

setInterval(createParticle, 120);

/* ===== TEXT ANIMATION ===== */
const text = "Connecting Workers and Employers";
const container = document.getElementById("text");

text.split("").forEach((c) => {
    const span = document.createElement("span");
    span.innerHTML = c === " " ? "&nbsp;" : c;
    span.style.opacity = "0";
    span.style.display = "inline-block";
    span.style.transform = "translateY(-10px)";
    span.style.transition = "0.25s ease";
    container.appendChild(span);
});

const letters = container.children;

/* ===== LOADING ===== */
let percent = 0;
const bar = document.querySelector(".progress-bar");

let interval = setInterval(() => {

    percent++;

    document.getElementById("percent").innerText = percent + "%";
    bar.style.width = percent + "%";

    let index = Math.floor((percent / 100) * letters.length);
    if (letters[index]) {
        letters[index].style.opacity = "1";
        letters[index].style.transform = "translateY(0)";
    }

    if (percent >= 100) {
        clearInterval(interval);

        setTimeout(() => {
            window.location.href = "index2.html";
        }, 500);
    }

}, 30);

</script>

</body>
</html>
