<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uganda JobsLink</title>

<style>

body {
    margin: 0;
    height: 100vh;
    background: #001A33;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

/* ===== YOUR UI ALWAYS ON TOP ===== */
.wrapper {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: white;
}

/* ===== LOGO BOX (UNCHANGED) ===== */
.image-box {
    width: 90%;
    max-width: 400px;
    height: 260px;
    background: white;
    border-radius: 20px;
    overflow: hidden;
}

.image-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* ===== BACKGROUND ===== */
.premium-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    overflow: hidden;
}

/* STACK AREA */
.stack-area {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 100%;
}

/* ICON BLOCK */
.icon-box {
    position: absolute;
    width: 45px;
    height: 45px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    color: white;
    animation: drop 0.5s ease forwards;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

/* DROP ANIMATION */
@keyframes drop {
    from {
        transform: translateY(-120vh);
        opacity: 0;
    }
    to {
        transform: translateY(0);
        opacity: 1;
    }
}

</style>
</head>

<body>

<!-- BACKGROUND -->
<div class="premium-bg"></div>

<!-- UI -->
<div class="wrapper">

    <div class="image-box">
        <img src="image_666.png">
    </div>

    <h2>Connecting Workers and Employers</h2>

</div>

<script>

/* ===== CREATE STACK LAYER ===== */
const bg = document.querySelector(".premium-bg");

const stackArea = document.createElement("div");
stackArea.className = "stack-area";
bg.appendChild(stackArea);

/* ===== REALISTIC APP ICONS ===== */
const icons = [
    "💼","📱","📊","🧑‍💻","📁",
    "🏢","📦","📝","📈","💡",
    "🖥️","📂","📌","📋"
];

/* COLORS */
const colors = [
    "#0a66c2","#00d4ff","#28a745",
    "#ff6b6b","#6f42c1","#ff9f1c"
];

const size = 50;
const columns = Math.floor(window.innerWidth / size);
let heights = new Array(columns).fill(0);

/* ===== DROP + STACK ===== */
function dropIcon() {

    const col = Math.floor(Math.random() * columns);
    const x = col * size;
    const y = heights[col] * size;

    const box = document.createElement("div");
    box.className = "icon-box";

    box.innerText = icons[Math.floor(Math.random() * icons.length)];

    box.style.background = colors[Math.floor(Math.random() * colors.length)];

    box.style.left = x + "px";
    box.style.bottom = y + "px";

    stackArea.appendChild(box);

    heights[col]++;

    /* stop when full screen */
    const maxHeight = Math.max(...heights) * size;
    if (maxHeight > window.innerHeight) {
        clearInterval(loop);
    }
}

/* SPEED CONTROL */
const loop = setInterval(dropIcon, 120);

</script>

</body>
</html>
