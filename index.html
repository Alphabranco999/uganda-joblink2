<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uganda JobsLink</title>

<style>

/* ===== BASE ===== */
body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #000814;
    color: white;
}

/* ===== CINEMATIC BACKGROUND ===== */
.bg {
    position: fixed;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at center, #0a66c2 0%, transparent 60%),
                radial-gradient(circle at 30% 70%, #00d4ff33, transparent 60%),
                #000814;
    animation: glowMove 8s ease-in-out infinite alternate;
    z-index: -1;
}

@keyframes glowMove {
    0% { transform: scale(1); filter: blur(0px); }
    100% { transform: scale(1.1); filter: blur(2px); }
}

/* ===== CENTER WRAPPER ===== */
.wrapper {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
}

/* ===== LOGO (CINEMATIC) ===== */
.logo {
    width: 180px;
    height: 180px;
    border-radius: 30px;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);

    opacity: 0;
    transform: scale(0.6);
    animation: logoIn 1.5s ease forwards;
}

.logo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* LOGO ANIMATION */
@keyframes logoIn {
    0% {
        opacity: 0;
        transform: scale(0.5) translateY(30px);
        filter: blur(10px);
    }
    60% {
        opacity: 1;
        transform: scale(1.1);
        filter: blur(0px);
    }
    100% {
        opacity: 1;
        transform: scale(1);
    }
}

/* ===== TITLE ===== */
.title {
    margin-top: 25px;
    font-size: 20px;
    letter-spacing: 2px;
    opacity: 0;
    animation: fadeIn 1.2s ease forwards;
    animation-delay: 1.2s;
}

/* ===== LOADING ===== */
.loading {
    margin-top: 20px;
    font-size: 13px;
    opacity: 0.7;
    letter-spacing: 1px;
}

.percent {
    margin-top: 5px;
    font-size: 13px;
}

.bar {
    width: 220px;
    height: 6px;
    background: rgba(255,255,255,0.15);
    border-radius: 20px;
    margin-top: 10px;
    overflow: hidden;
}

.fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #00d4ff, #0a66c2);
    transition: width 0.1s linear;
}

/* FADE IN */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

</style>
</head>

<body>

<div class="bg"></div>

<div class="wrapper">

    <div class="logo">
        <img src="image_666.png">
    </div>

    <div class="title">Connecting Workers & Employers</div>

    <div class="loading">Loading</div>
    <div class="percent" id="percent">0%</div>

    <div class="bar">
        <div class="fill" id="fill"></div>
    </div>

</div>

<script>

/* ===== LOADING ===== */
let percent = 0;
const fill = document.getElementById("fill");
const text = document.getElementById("percent");

let loader = setInterval(() => {

    percent++;

    text.innerText = percent + "%";
    fill.style.width = percent + "%";

    if (percent >= 100) {
        clearInterval(loader);

        setTimeout(() => {
            window.location.href = "index2.html";
        }, 600);
    }

}, 30);

</script>

</body>
</html>
