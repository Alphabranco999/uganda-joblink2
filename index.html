<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uganda JobsLink</title>

<script src="https://unpkg.com/lucide@latest"></script>

<style>

/* ===== BODY ===== */
body {
    margin: 0;
    height: 100vh;
    background: #001A33;
    font-family: Arial, sans-serif;
    color: white;
    overflow: hidden;
}

/* ===== BACKGROUND ===== */
.premium-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    z-index: -1;
    pointer-events: none;
}

/* 🌈 Gradient */
.gradient-layer {
    position: absolute;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle at 30% 30%, #0a66c2, transparent),
                radial-gradient(circle at 70% 70%, #00d4ff, transparent),
                radial-gradient(circle at 50% 80%, #001a33, #000);
    animation: gradientMove 12s infinite alternate ease-in-out;
}

@keyframes gradientMove {
    0% { transform: translate(0,0); }
    100% { transform: translate(-10%, -10%); }
}

/* ✨ Particles */
.particles span {
    position: absolute;
    width: 4px;
    height: 4px;
    background: white;
    border-radius: 50%;
    animation: float linear infinite;
}

@keyframes float {
    from { transform: translateY(100vh); }
    to { transform: translateY(-10vh); }
}

/* 💼 Falling icons */
.fall-item {
    position: absolute;
    top: -50px;
    animation: fall linear infinite;
}

.fall-item svg {
    width: 22px;
    height: 22px;
    stroke: currentColor;
    opacity: 0.1;
    filter: blur(0.5px) drop-shadow(0 0 6px currentColor);
}

@keyframes fall {
    0% { transform: translateY(-50px); opacity: 0; }
    20% { opacity: 0.2; }
    100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
}

/* ===== UI CONTENT ===== */
.wrapper {
    position: relative;
    z-index: 10;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

/* IMAGE */
.image-box {
    width: 90%;
    max-width: 400px;
    height: 260px;
    border-radius: 20px;
    overflow: hidden;
    animation: imageEnter 1.2s ease-out forwards;
}

@keyframes imageEnter {
    0% { opacity: 0; transform: translateY(-80px) scale(0.7); }
    100% { opacity: 1; transform: translateY(-20px) scale(1); }
}

.image-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* TEXT */
.welcome {
    font-size: clamp(18px, 5vw, 26px);
    font-weight: bold;
    margin-top: 20px;
}

/* LOADING */
.loading-text {
    margin-top: 20px;
    font-size: 14px;
}

.percent {
    margin-top: 5px;
}

/* BAR */
.progress-container {
    width: 80%;
    height: 8px;
    background: rgba(255,255,255,0.2);
    border-radius: 20px;
    margin-top: 10px;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #00FFA3, #00D4FF, #0084FF);
    border-radius: 20px;
}

</style>
</head>

<body>

<!-- 🌌 BACKGROUND -->
<div class="premium-bg">
    <div class="gradient-layer"></div>
    <div class="particles"></div>
    <div class="bg-animation"></div>
</div>

<!-- 🎯 CONTENT -->
<div class="wrapper">

    <div class="image-box">
        <img src="image_666.png">
    </div>

    <div class="welcome">Connecting Workers and Employers</div>

    <div class="loading-text">Loading...</div>
    <div class="percent" id="percent">0%</div>

    <div class="progress-container">
        <div class="progress-bar"></div>
    </div>

</div>

<script>

/* ===== PARTICLES ===== */
const particleContainer = document.querySelector(".particles");

for (let i = 0; i < 40; i++) {
    const dot = document.createElement("span");
    dot.style.left = Math.random() * 100 + "vw";
    dot.style.animationDuration = (5 + Math.random() * 10) + "s";
    dot.style.opacity = Math.random();
    particleContainer.appendChild(dot);
}

/* ===== ICONS ===== */
const bg = document.querySelector(".bg-animation");

const icons = [
    "briefcase","file-text","bar-chart","user",
    "folder","bookmark","building","clipboard",
    "layers","pie-chart","users","award"
];

const colors = [
    "#00FFA3","#00D4FF","#0084FF",
    "#FFD700","#FF6B6B","#A66CFF","#00C9A7"
];

let i = 0;

function createIcon() {
    const item = document.createElement("div");
    item.classList.add("fall-item");

    const icon = icons[i];
    i = (i + 1) % icons.length;

    const color = colors[Math.floor(Math.random() * colors.length)];

    item.innerHTML = `<i data-lucide="${icon}"></i>`;
    item.style.color = color;

    item.style.left = Math.random() * 100 + "vw";
    item.style.animationDuration = (5 + Math.random() * 5) + "s";

    bg.appendChild(item);
    lucide.createIcons();

    setTimeout(() => item.remove(), 10000);
}

setInterval(createIcon, 300);

/* ===== LOADING ===== */
let percent = 0;
const bar = document.querySelector(".progress-bar");

let interval = setInterval(() => {
    percent++;
    document.getElementById("percent").innerText = percent + "%";
    bar.style.width = percent + "%";

    if (percent >= 100) {
        clearInterval(interval);
        setTimeout(() => {
            window.location.href = "index2.html";
        }, 500);
    }
}, 30);

</script>

</body>
</html>
